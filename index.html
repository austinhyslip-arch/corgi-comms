document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

andValidationH\" sc-camel-start-offset=\"50%\" text-anchor=\"middle\">VALIDATION<\u002FtextPath><\u002Ftext>\n\n        <circle cx=\"150\" cy=\"150\" r=\"82\" fill=\"{{ accentColor }}\"><\u002Fcircle>\n        <text x=\"150\" y=\"144\" text-anchor=\"middle\" style=\"{{ centerTextStyle }}\">The Communications<\u002Ftext>\n        <text x=\"150\" y=\"167\" text-anchor=\"middle\" style=\"{{ centerTextStyle }}\">Flywheel<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <div style=\"{{ heroCardStyle }}\">\n      <p style=\"{{ heroCardTextStyle }}\">{{ heroHeadlinePart2 }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"{{ connectorWrapStyle }}\">\n    <svg sc-camel-view-box=\"0 0 300 40\" width=\"100%\" height=\"40\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display: block; overflow: visible;\">\n      <defs>\n        <marker id=\"connectorArrow\" sc-camel-marker-width=\"8\" sc-camel-marker-height=\"8\" sc-camel-ref-x=\"5.5\" sc-camel-ref-y=\"2.75\" orient=\"auto\" sc-camel-marker-units=\"userSpaceOnUse\">\n          <path d=\"M0,0 L5.5,2.75 L0,5.5 Z\" fill=\"{{ accentColor }}\"><\u002Fpath>\n        <\u002Fmarker>\n      <\u002Fdefs>\n      <line x1=\"50\" y1=\"2\" x2=\"50\" y2=\"32\" stroke=\"{{ accentColor }}\" stroke-width=\"1.5\" opacity=\"0.55\" marker-end=\"url(#connectorArrow)\"><\u002Fline>\n      <line x1=\"150\" y1=\"2\" x2=\"150\" y2=\"32\" stroke=\"{{ accentColor }}\" stroke-width=\"1.5\" opacity=\"0.55\" marker-end=\"url(#connectorArrow)\"><\u002Fline>\n      <line x1=\"250\" y1=\"2\" x2=\"250\" y2=\"32\" stroke=\"{{ accentColor }}\" stroke-width=\"1.5\" opacity=\"0.55\" marker-end=\"url(#connectorArrow)\"><\u002Fline>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <div style=\"{{ cardsGridStyle }}\">\n    <sc-for list=\"{{ cards }}\" as=\"card\" hint-placeholder-count=\"4\">\n      <section ref=\"{{ card.ref }}\" style=\"{{ card.outerStyle }}\">\n        <div style=\"{{ card.innerStyle }}\">\n         <div style=\"{{ card.shellStyle }}\">\n          <div style=\"{{ card.topRowStyle }}\">\n            <span style=\"{{ card.iconWrapStyle }}\">\n              <span style=\"{{ card.iconFontStyle }}\">{{ card.icon }}<\u002Fspan>\n            <\u002Fspan>\n            <h2 style=\"{{ card.titleStyle }}\">{{ card.title }}<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"{{ card.standsBlockStyle }}\">\n            <div style=\"{{ card.microLabelStyle }}\">Where It Stands<\u002Fdiv>\n            <p style=\"{{ card.standsTextStyle }}\">{{ card.stands }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"{{ card.dividerStyle }}\"><\u002Fdiv>\n          <div style=\"{{ card.microLabelStyle }}\">Where I'd Take It<\u002Fdiv>\n          <ul style=\"{{ card.bulletListStyle }}\">\n            <sc-for list=\"{{ card.bullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n              <li style=\"{{ card.bulletItemStyle }}\">\n                <span style=\"{{ card.bulletMarkerStyle }}\"><\u002Fspan>\n                <span>{{ b }}<\u002Fspan>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n          <div style=\"{{ card.bottomLabelRowStyle }}\">\n            <sc-for list=\"{{ card.labelWords }}\" as=\"lw\" hint-placeholder-count=\"2\">\n              <span style=\"{{ lw.style }}\">{{ lw.text }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n         <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <section ref=\"{{ flywheelRef }}\" style=\"{{ flywheelSectionStyle }}\">\n    <div style=\"{{ flywheelInnerStyle }}\">\n      <div style=\"{{ flywheelLabelRowStyle }}\">\n        <sc-for list=\"{{ flywheelEyebrowWords }}\" as=\"fw\" hint-placeholder-count=\"1\">\n          <span style=\"{{ fw.style }}\">{{ fw.text }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <h2 style=\"{{ flywheelTitleStyle }}\">The Flywheel<\u002Fh2>\n      <p style=\"{{ flywheelBodyStyle }}\">Foundation, Substance, Validation. None of these work alone. A strong narrative with nothing behind it is just a tagline. Content nobody spreads doesn't move the needle. Press coverage without a real point of view is just a mention. Each piece feeds the next, and press earned through real thought leadership does more for Corgi's credibility than press earned through a funding number ever will. That's the system. Not three initiatives, one loop that gets stronger every time it turns.<\u002Fp>\n\n      <div style=\"{{ closingFlywheelWrapStyle }}\">\n        <svg sc-camel-view-box=\"0 0 300 300\" width=\"100%\" height=\"100%\" style=\"{{ svgLargeStyle }}\">\n          <defs>\n            <marker id=\"ringArrowBig\" sc-camel-marker-width=\"9\" sc-camel-marker-height=\"9\" sc-camel-ref-x=\"6.5\" sc-camel-ref-y=\"3.25\" orient=\"auto\" sc-camel-marker-units=\"userSpaceOnUse\">\n              <path d=\"M0,0 L6.5,3.25 L0,6.5 Z\" fill=\"{{ accentColor }}\"><\u002Fpath>\n            <\u002Fmarker>\n          <\u002Fdefs>\n          <path id=\"bandFoundationC\" class=\"corgi-arc\" d=\"M160.5,30.5 A120,120 0 0 1 258.8,200.7\" fill=\"none\" stroke=\"{{ accentColor }}\" stroke-width=\"34\" marker-end=\"url(#ringArrowBig)\"><\u002Fpath>\n          <path class=\"corgi-arc corgi-arc-2\" d=\"M248.3,218.8 A120,120 0 0 1 51.7,218.8\" fill=\"none\" stroke=\"{{ accentColor }}\" stroke-opacity=\"0.68\" stroke-width=\"34\" marker-end=\"url(#ringArrowBig)\"><\u002Fpath>\n          <path id=\"bandValidationC\" class=\"corgi-arc corgi-arc-3\" d=\"M41.2,200.7 A120,120 0 0 1 139.5,30.5\" fill=\"none\" stroke=\"{{ accentColor }}\" stroke-opacity=\"0.4\" stroke-width=\"34\" marker-end=\"url(#ringArrowBig)\"><\u002Fpath>\n          <path id=\"textSubstanceC\" d=\"M51.7,218.8 A120,120 0 0 0 248.3,218.8\" fill=\"none\" stroke=\"none\"><\u002Fpath>\n\n          <text dy=\"5\" style=\"{{ ringLabelStyle }}\"><textPath href=\"#bandFoundationC\" sc-camel-start-offset=\"50%\" text-anchor=\"middle\">FOUNDATION<\u002FtextPath><\u002Ftext>\n          <text dy=\"5\" style=\"{{ ringLabelStyle }}\"><textPath href=\"#textSubstanceC\" sc-camel-start-offset=\"50%\" text-anchor=\"middle\">SUBSTANCE<\u002FtextPath><\u002Ftext>\n          <text dy=\"5\" style=\"{{ ringLabelDarkStyle }}\"><textPath href=\"#bandValidationC\" sc-camel-start-offset=\"50%\" text-anchor=\"middle\">VALIDATION<\u002FtextPath><\u002Ftext>\n\n          <circle cx=\"150\" cy=\"150\" r=\"82\" fill=\"{{ accentColor }}\"><\u002Fcircle>\n          <text x=\"150\" y=\"144\" text-anchor=\"middle\" style=\"{{ centerTextStyle }}\">The Communications<\u002Ftext>\n          <text x=\"150\" y=\"167\" text-anchor=\"middle\" style=\"{{ centerTextStyle }}\">Flywheel<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"{{ footerStyle }}\">\n    <div style=\"{{ footerNameStyle }}\">Austin Hyslip<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 480, &quot;height&quot;: 900},\n  &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#3B6FE0&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#3B6FE0&quot;, &quot;#2F5FCB&quot;, &quot;#4C82E8&quot;, &quot;#1F4FB0&quot;], &quot;section&quot;: &quot;Theme&quot;},\n  &quot;reduceMotion&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Motion&quot;},\n  &quot;cardAlignment&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;row&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;row&quot;, &quot;alternating&quot;], &quot;section&quot;: &quot;Layout&quot;}\n}\">\nclass Component extends DCLogic {\n  state = {\n    heroVisible: false,\n    cardVisible: [false, false, false, false],\n    flywheelVisible: false,\n    isDesktop: typeof window !== 'undefined' ? window.innerWidth >= 860 : true\n  };\n\n  cardRefs = [];\n\n  componentDidMount() {\n    this._resize = () => this.setState({ isDesktop: window.innerWidth >= 860 });\n    window.addEventListener('resize', this._resize);\n\n    setTimeout(() => this.setState({ heroVisible: true }), 60);\n\n    const makeObserver = (onHit) => new IntersectionObserver((entries, obs) => {\n      entries.forEach(entry => {\n        if (entry.isIntersecting) { onHit(); obs.unobserve(entry.target); }\n      });\n    }, { threshold: 0.2 });\n\n    requestAnimationFrame(() => {\n      if (this.heroEl) makeObserver(() => this.setState({ heroVisible: true })).observe(this.heroEl);\n      if (this.flywheelEl) makeObserver(() => this.setState({ flywheelVisible: true })).observe(this.flywheelEl);\n      this.cardRefs.forEach((el, i) => {\n        if (!el) return;\n        makeObserver(() => {\n          this.setState(s => {\n            const next = s.cardVisible.slice();\n            next[i] = true;\n            return { cardVisible: next };\n          });\n        }).observe(el);\n      });\n    });\n  }\n\n  componentWillUnmount() {\n    if (this._resize) window.removeEventListener('resize', this._resize);\n  }\n\n  setCardRef(i) {\n    return (el) => { this.cardRefs[i] = el; };\n  }\n\n  wordSpans(text, visible, baseStyle, reduceMotion) {\n    return text.split(' ').map((word, i) => ({\n      text: word,\n      style: {\n        ...baseStyle,\n        display: 'inline-block',\n        opacity: reduceMotion ? 1 : (visible ? 1 : 0),\n        transform: reduceMotion ? 'none' : (visible ? 'translateY(0)' : 'translateY(10px)'),\n        transition: `opacity 0.5s ease-out ${i * 0.07}s, transform 0.5s ease-out ${i * 0.07}s`\n      }\n    }));\n  }\n\n  renderVals() {\n    const accentColor = this.props.accentColor ?? '#1F8A70';\n    const reduceMotion = !!this.props.reduceMotion;\n    const alternate = (this.props.cardAlignment ?? 'left') === 'alternating';\n    const ink = 'oklch(21% 0.016 50)';\n    const inkSoft = 'oklch(42% 0.02 50)';\n    const bg = 'oklch(96.5% 0.018 70)';\n    const cardBg = 'oklch(98.5% 0.01 70)';\n\n    const font = \"'Manrope', -apple-system, BlinkMacSystemFont, sans-serif\";\n    const iconFont = \"'Material Symbols Outlined'\";\n\n    const pageStyle = {\n      position: 'relative',\n      fontFamily: font,\n      background: bg,\n      color: ink,\n      minHeight: '100vh',\n      overflowX: 'hidden'\n    };\n\n    const bgGlowStyle = {\n      position: 'absolute', top: 0, left: 0, right: 0, height: '560px',\n      background: `radial-gradient(65% 65% at 50% 0%, oklch(92% 0.035 230 / 0.55), transparent 72%)`,\n      pointerEvents: 'none', zIndex: 0\n    };\n\n    const heroVisible = this.state.heroVisible;\n    const shift = (visible, amt) => reduceMotion ? 'none' : (visible ? 'translateY(0)' : `translateY(${amt}px)`);\n    const fade = (visible) => reduceMotion ? 1 : (visible ? 1 : 0);\n    const trans = (delay) => reduceMotion ? 'none' : `opacity 0.7s ease-out ${delay}s, transform 0.7s ease-out ${delay}s`;\n\n    const heroSectionStyle = {\n      position: 'relative', zIndex: 1,\n      display: 'flex',\n      flexDirection: 'column',\n      gap: '18px',\n      maxWidth: '900px', margin: '0 auto',\n      padding: 'clamp(56px, 10vw, 96px) clamp(20px, 5vw, 40px) clamp(24px, 5vw, 40px)'\n    };\n\n    const bylineBlockStyle = {\n      textAlign: 'center',\n      margin: '0 auto 28px',\n      opacity: fade(heroVisible), transform: shift(heroVisible, 12), transition: trans(0.1)\n    };\n    const bylineNameStyle = { fontSize: '24px', fontWeight: 700, color: ink };\n    const bylineRoleStyle = { fontSize: '21px', fontWeight: 400, color: inkSoft, marginTop: '4px' };\n\n    const heroHeadlineStyle = {\n      fontSize: 'clamp(1.3rem, 2.6vw, 2.05rem)', fontWeight: 800, letterSpacing: '-0.015em',\n      lineHeight: 1.25, margin: 0, color: ink,\n      opacity: fade(heroVisible), transform: shift(heroVisible, 18), transition: trans(0.18)\n    };\n\n    const heroHeadlinePart1 = \"Corgi is rebuilding the largest unautomated industry in financial services. Right now, most people know that through funding headlines.\";\n    const heroHeadlinePart2 = \"The next chapter is becoming the voice people actually trust to explain what this means for them, not just the startup that raised the most. Here's the flywheel I'd build to get there.\";\n\n    const topFlywheelWrapStyle = {\n      width: '100%', maxWidth: '240px', margin: '20px auto',\n      opacity: fade(heroVisible), transition: trans(0.3)\n    };\n\n    const heroCardStyle = {\n      background: `${accentColor}0d`, borderRadius: '20px',\n      padding: 'clamp(24px, 4vw, 36px)',\n      opacity: fade(heroVisible), transform: shift(heroVisible, 18), transition: trans(0.24)\n    };\n    const heroCardTextStyle = { ...heroHeadlineStyle, fontWeight: 500 };\n\n    const connectorWrapStyle = {\n      position: 'relative', zIndex: 1,\n      maxWidth: '1180px', margin: '0 auto',\n      padding: '0 clamp(20px, 5vw, 40px)'\n    };\n\n    const svgPreviewStyle = { display: 'block', overflow: 'visible' };\n    const ringLabelStyle = { fontSize: '15px', fontWeight: 800, fill: '#fff', fontFamily: font, letterSpacing: '0.02em' };\n    const ringLabelDarkStyle = { fontSize: '15px', fontWeight: 800, fill: ink, fontFamily: font, letterSpacing: '0.02em' };\n    const centerTextStyle = { fontSize: '13px', fontWeight: 700, fill: '#fff', fontFamily: font };\n\n    const cardData = [\n      { icon: 'anchor', title: 'Narrative', label: 'THE FOUNDATION',\n        stands: \"Every launch reads like its own announcement.\",\n        bullets: [\n          \"Shepard, Claims, trucking, and whatever's next, tied back to one mission\",\n          \"One consistent story, no matter who's telling it\",\n          \"A carrier that sounds accountable, not just fast\"\n        ] },\n      { icon: 'edit_note', title: 'Content', label: 'THE SUBSTANCE',\n        stands: \"Corgi has real expertise in-house and employees already engaging on their own, but there's no content built to carry either one further.\",\n        bullets: [\n          \"A newsletter and blog built around the people who actually understand this industry, not just funding milestones\",\n          \"White papers, customer stories, high-impact data used as storytelling\",\n          \"MQL-generating content like webinars, gated assets, and one-pagers\"\n        ] },\n      { icon: 'campaign', title: 'PR', label: 'THE VALIDATION',\n        stands: \"Corgi has real expertise in-house, but press coverage so far leads with the size of the check, not the people who actually understand this industry.\",\n        bullets: [\n          \"A story led by impact and expertise, not valuation\",\n          \"Journalists introduced to the people behind the thinking, not just the news\",\n          \"A point of view ready before the next big moment, not after\"\n        ] }\n    ];\n\n    const cardsGridStyle = {\n      position: 'relative', zIndex: 1,\n      maxWidth: '1180px', margin: '0 auto',\n      padding: '8px clamp(20px, 5vw, 40px) clamp(56px, 10vw, 96px)',\n      display: 'grid',\n      gridTemplateColumns: this.state.isDesktop ? 'repeat(3, 1fr)' : '1fr',\n      gap: this.state.isDesktop ? '28px' : '24px'\n    };\n\n    const cards = cardData.map((c, i) => {\n      const visible = this.state.cardVisible[i];\n      const outerStyle = {\n        position: 'relative', zIndex: 1, height: '100%',\n        opacity: fade(visible), transform: shift(visible, 22), transition: trans(0)\n      };\n      const innerStyle = {\n        position: 'relative', height: '100%',\n        background: `linear-gradient(135deg, ${accentColor}55, transparent 55%)`,\n        padding: '1.5px', borderRadius: '24px',\n        transition: reduceMotion ? 'none' : 'transform 0.35s ease-out, box-shadow 0.35s ease-out'\n      };\n      const cardShellStyle = {\n        background: cardBg, borderRadius: '22.5px', height: '100%', boxSizing: 'border-box',\n        padding: 'clamp(22px, 2.4vw, 30px)',\n        display: 'flex', flexDirection: 'column'\n      };\n      const topRowStyle = { display: 'flex', alignItems: 'center', gap: '14px', marginBottom: '22px' };\n      const iconWrapStyle = {\n        flex: '0 0 auto',\n        width: '36px', height: '36px', borderRadius: '11px',\n        background: `${accentColor}1a`, display: 'flex', alignItems: 'center', justifyContent: 'center'\n      };\n      const iconFontStyle = { fontFamily: iconFont, fontSize: '20px', color: accentColor };\n      const titleStyle = { fontSize: 'clamp(1.4rem, 2.2vw, 1.8rem)', fontWeight: 800, letterSpacing: '-0.02em', margin: 0, color: ink };\n      const bottomLabelRowStyle = { display: 'flex', flexWrap: 'wrap', gap: '0.4em', justifyContent: 'center', marginTop: 'auto', paddingTop: '26px' };\n      const labelWordBase = { fontSize: '20px', fontWeight: 700, letterSpacing: '0.06em', color: accentColor };\n      const microLabelStyle = { fontSize: '11px', fontWeight: 700, letterSpacing: '0.1em', color: accentColor, textTransform: 'uppercase', marginBottom: '8px' };\n      const standsBlockStyle = {\n        background: `${accentColor}0d`, borderRadius: '14px',\n        padding: '14px 16px', marginBottom: '22px', height: '11.5em', boxSizing: 'border-box',\n        display: 'flex', flexDirection: 'column', justifyContent: 'flex-start'\n      };\n      const standsTextStyle = { fontSize: 'clamp(0.95rem, 1vw, 1.02rem)', lineHeight: 1.55, color: ink, margin: 0, fontWeight: 500 };\n      const dividerStyle = { height: '1px', background: `${accentColor}30`, margin: '0 0 18px' };\n      const bulletListStyle = { listStyle: 'none', margin: 0, padding: 0, display: 'flex', flexDirection: 'column', gap: '12px' };\n      const bulletItemStyle = { display: 'flex', alignItems: 'flex-start', gap: '10px', fontSize: 'clamp(0.88rem, 0.95vw, 0.95rem)', lineHeight: 1.5, color: inkSoft };\n      const bulletMarkerStyle = { flex: '0 0 auto', width: '6px', height: '6px', borderRadius: '50%', background: accentColor, marginTop: '7px' };\n\n      return {\n        ...c,\n        ref: this.setCardRef(i),\n        outerStyle,\n        innerStyle,\n        shellStyle: cardShellStyle,\n        topRowStyle, iconWrapStyle, iconFontStyle, titleStyle, bottomLabelRowStyle,\n        microLabelStyle, standsBlockStyle, standsTextStyle, dividerStyle, bulletListStyle, bulletItemStyle, bulletMarkerStyle,\n        labelWords: this.wordSpans(c.label, visible, labelWordBase, reduceMotion)\n      };\n    });\n\n    const flywheelVisible = this.state.flywheelVisible;\n    const flywheelSectionStyle = {\n      position: 'relative', zIndex: 1,\n      padding: 'clamp(48px, 8vw, 80px) clamp(20px, 5vw, 40px) clamp(60px, 10vw, 100px)'\n    };\n    const flywheelInnerStyle = {\n      maxWidth: '860px', margin: '0 auto',\n      background: `linear-gradient(150deg, oklch(92% 0.03 230 / 0.5), ${cardBg})`,\n      border: `1px solid ${accentColor}33`,\n      borderRadius: '32px',\n      padding: 'clamp(32px, 6vw, 64px)',\n      textAlign: 'center',\n      opacity: fade(flywheelVisible), transform: shift(flywheelVisible, 24), transition: trans(0)\n    };\n    const flywheelLabelRowStyle = { display: 'flex', justifyContent: 'center', gap: '0.4em', marginBottom: '14px' };\n    const flywheelEyebrowWords = this.wordSpans('THE SYSTEM', flywheelVisible, { fontSize: '12px', fontWeight: 700, letterSpacing: '0.14em', color: accentColor }, reduceMotion);\n    const flywheelTitleStyle = { fontSize: 'clamp(2.1rem, 5vw, 3.2rem)', fontWeight: 800, letterSpacing: '-0.02em', margin: '0 0 18px', color: ink };\n    const flywheelBodyStyle = { fontSize: 'clamp(1rem, 1.4vw, 1.15rem)', lineHeight: 1.7, color: inkSoft, margin: '0 auto', maxWidth: '58ch' };\n    const closingFlywheelWrapStyle = { width: 'min(380px, 85vw)', margin: '40px auto 0' };\n    const svgLargeStyle = { display: 'block', overflow: 'visible' };\n\n    const footerStyle = { position: 'relative', zIndex: 1, textAlign: 'center', padding: '32px 20px 56px' };\n    const footerNameStyle = { fontSize: '13px', fontWeight: 600, color: inkSoft, letterSpacing: '0.04em' };\n\n    return {\n      accentColor,\n      heroRef: (el) => { this.heroEl = el; },\n      flywheelRef: (el) => { this.flywheelEl = el; },\n      pageStyle, bgGlowStyle,\n      heroSectionStyle,\n      bylineBlockStyle, bylineNameStyle, bylineRoleStyle,\n      heroHeadlineStyle, heroHeadlinePart1, heroHeadlinePart2, topFlywheelWrapStyle, svgPreviewStyle,\n      ringLabelStyle, ringLabelDarkStyle, centerTextStyle, heroCardStyle, heroCardTextStyle, connectorWrapStyle,\n      cardsGridStyle, cards,\n      flywheelSectionStyle, flywheelInnerStyle, flywheelLabelRowStyle, flywheelEyebrowWords,\n      flywheelTitleStyle, flywheelBodyStyle, closingFlywheelWrapStyle, svgLargeStyle,\n      footerStyle, footerNameStyle\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
